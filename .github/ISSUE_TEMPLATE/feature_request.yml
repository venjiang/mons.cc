name: Feature request
description: Suggest an improvement to Mons.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what you would like Mons to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workaround or alternatives
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples or screenshots; do not include private credentials.
